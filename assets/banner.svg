<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6; #8b5cf6; #ec4899; #3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6; #ec4899; #3b82f6; #8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899; #3b82f6; #8b5cf6; #ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Terminal Pane Gradient -->
    <linearGradient id="paneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-40px); }
    }
    .cursor { animation: blink 1s infinite; }
    .status-pulse { animation: pulseGlow 3s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif; font-weight: 800; }
    .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
  </style>

  <!-- Outer Card Frame with Animated Border -->
  <rect x="4" y="4" width="952" height="312" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Window Bar -->
  <rect x="4" y="4" width="952" height="38" rx="16" fill="#131c2e" fill-opacity="0.9" />
  <rect x="4" y="24" width="952" height="18" fill="#131c2e" fill-opacity="0.9" />
  <line x1="4" y1="42" x2="956" y2="42" stroke="#334155" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="23" r="6" fill="#ef4444" />
  <circle cx="48" cy="23" r="6" fill="#f59e0b" />
  <circle cx="68" cy="23" r="6" fill="#10b981" />

  <!-- Window Status Breadcrumbs -->
  <text x="100" y="27" fill="#64748b" class="mono-text" font-size="12">session: 0 [tmux/zellij] • 3 panes • active</text>

  <!-- Live Pulse Dot -->
  <circle cx="910" cy="23" r="5" fill="#10b981">
    <animate attributeName="r" values="4; 6.5; 4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1; 0.4; 1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="840" y="27" fill="#10b981" class="mono-text" font-size="11" font-weight="bold">DETACHED</text>

  <!-- Background Pane Layout (Simulating Multiplexer Grid) -->
  <g opacity="0.25">
    <!-- Left Pane -->
    <rect x="24" y="56" width="220" height="206" rx="8" fill="url(#paneGrad)" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <text x="36" y="78" fill="#94a3b8" class="mono-text" font-size="11">$ zellij attach</text>
    <text x="36" y="98" fill="#64748b" class="mono-text" font-size="10">Session: master</text>
    <text x="36" y="116" fill="#64748b" class="mono-text" font-size="10">Uptime: 14d 6h</text>
    <text x="36" y="134" fill="#38bdf8" class="mono-text" font-size="10">Tasks: 4 running</text>

    <!-- Right Pane Top -->
    <rect x="716" y="56" width="220" height="98" rx="8" fill="url(#paneGrad)" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <text x="728" y="78" fill="#94a3b8" class="mono-text" font-size="11">$ tmux split-window</text>
    <text x="728" y="98" fill="#a855f7" class="mono-text" font-size="10">%2: htop (active)</text>
    <text x="728" y="116" fill="#64748b" class="mono-text" font-size="10">CPU 12% | MEM 2.4G</text>

    <!-- Right Pane Bottom -->
    <rect x="716" y="164" width="220" height="98" rx="8" fill="url(#paneGrad)" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" />
    <text x="728" y="186" fill="#94a3b8" class="mono-text" font-size="11">$ wezterm cli split</text>
    <text x="728" y="206" fill="#ec4899" class="mono-text" font-size="10">%3: tail -f build.log</text>
  </g>

  <!-- Multiplexer Bottom Status Bar -->
  <rect x="4" y="278" width="952" height="38" rx="0" fill="#090d16" fill-opacity="0.95" />
  <line x1="4" y1="278" x2="956" y2="278" stroke="#1e293b" stroke-width="1.5" />
  <rect x="18" y="286" width="92" height="22" rx="4" fill="#3b82f6" />
  <text x="28" y="301" fill="#ffffff" class="mono-text" font-size="11" font-weight="bold">[0] bash*</text>
  <rect x="116" y="286" width="96" height="22" rx="4" fill="#1e293b" />
  <text x="126" y="301" fill="#94a3b8" class="mono-text" font-size="11">[1] python-job</text>
  <rect x="218" y="286" width="86" height="22" rx="4" fill="#1e293b" />
  <text x="228" y="301" fill="#94a3b8" class="mono-text" font-size="11">[2] remote-ssh</text>
  <text x="760" y="301" fill="#64748b" class="mono-text" font-size="11">Prefix: Ctrl-b / Ctrl-a | Zellij: Alt-n</text>

  <!-- Foreground Title and Hero Content (Guaranteed Foreground Layer) -->
  <g id="foreground-hero">
    <!-- Category Tag / Pill -->
    <g transform="translate(300, 64)">
      <rect x="0" y="0" width="360" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="18" fill="#93c5fd" class="mono-text" font-size="11" font-weight="600">CURATED DEVELOPER ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="480" y="132" text-anchor="middle" fill="#ffffff" class="title-text" font-size="34" letter-spacing="-0.5">Awesome Terminal Multiplexers</text>
    
    <!-- Subtitle -->
    <text x="480" y="164" text-anchor="middle" fill="#94a3b8" class="title-text" font-size="15" font-weight="400">Persistent Shell Sessions, Pane Orchestration &amp; Terminal Workspaces</text>

    <!-- Interactive Interactive Terminal Prompt in Foreground -->
    <g transform="translate(260, 184)">
      <rect x="0" y="0" width="440" height="34" rx="6" fill="#090d16" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#10b981" class="mono-text" font-size="13" font-weight="bold">➜</text>
      <text x="36" y="22" fill="#38bdf8" class="mono-text" font-size="13">~</text>
      <text x="56" y="22" fill="#f1f5f9" class="mono-text" font-size="13">tmux new -s workspace &amp;&amp; zellij</text>
      <text x="340" y="22" fill="#38bdf8" class="mono-text cursor" font-size="14" font-weight="bold">█</text>
    </g>

    <!-- Tech Pills -->
    <g transform="translate(195, 234)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="125" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="62" y="16" text-anchor="middle" fill="#c7d2fe" class="mono-text" font-size="10.5" font-weight="bold">⚡ PERSISTENCE</text>

      <!-- Pill 2 -->
      <rect x="135" y="0" width="125" height="24" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1" />
      <text x="197" y="16" text-anchor="middle" fill="#bfdbfe" class="mono-text" font-size="10.5" font-weight="bold">🪟 SPLIT PANES</text>

      <!-- Pill 3 -->
      <rect x="270" y="0" width="145" height="24" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="1" />
      <text x="342" y="16" text-anchor="middle" fill="#bbf7d0" class="mono-text" font-size="10.5" font-weight="bold">🛡️ SSH DISCONNECT</text>

      <!-- Pill 4 -->
      <rect x="425" y="0" width="145" height="24" rx="12" fill="#3b0764" stroke="#d946ef" stroke-width="1" />
      <text x="497" y="16" text-anchor="middle" fill="#f5d0fe" class="mono-text" font-size="10.5" font-weight="bold">🚀 TMUX &amp; ZELLIJ</text>
    </g>
  </g>
</svg>
